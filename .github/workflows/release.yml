name: Release

# Every push to main: if there is no GitHub Release for the version in package.json yet,
# build Enide for macOS (Apple Silicon + Intel) and Windows and publish the release
# (tag v<version> is created automatically). Bump "version" in package.json to ship a new one.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild and re-upload even if the release exists'
        type: boolean
        default: false

permissions:
  contents: write

env:
  ENIDE_SKIP_PTY_REBUILD: '1'   # use node-pty's prebuilt binaries for every OS/arch
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "Release $tag already exists — nothing to build."; echo "build=no" >> "$GITHUB_OUTPUT"
          else
            echo "build=yes" >> "$GITHUB_OUTPUT"
          fi

  mac:
    needs: version
    if: needs.version.outputs.build == 'yes'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: rm -rf node_modules/node-pty/build
      - name: Build Enide.app (arm64 + x64)
        run: npx electron-builder --mac dir --arm64 --x64 --publish never -c.mac.identity=null
      - name: Sign ad-hoc and zip (Enide 1.0 picks the release page when there is no .dmg)
        run: |
          mkdir -p out
          for pair in "release/mac-arm64:arm64" "release/mac:x64"; do
            dir="${pair%%:*}"; arch="${pair##*:}"
            app="$dir/Enide.app"
            [ -d "$app" ] || { echo "missing $app"; ls -la release; exit 1; }
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict "$app"
            ditto -c -k --keepParent "$app" "out/Enide-mac-$arch.zip"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: out/* }

  windows:
    needs: version
    if: needs.version.outputs.build == 'yes'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: Remove-Item -Recurse -Force node_modules/node-pty/build -ErrorAction SilentlyContinue
        shell: pwsh
      - name: Build installer + portable zip
        run: npx electron-builder --win nsis zip --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.exe
            release/*.zip

  release:
    needs: [version, mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Enide ${{ needs.version.outputs.tag }}
          make_latest: true
          files: dist/*
          fail_on_unmatched_files: false
          body: |
            ## Скачать

            | Система | Файл |
            |---|---|
            | macOS · Apple Silicon (M1–M4) | **Enide-mac-arm64.zip** → распаковать → перетащить Enide в «Программы» |
            | macOS · Intel | **Enide-mac-x64.zip** |
            | Windows 10/11 · установщик | **Enide-Setup-win-x64.exe** |
            | Windows · без установки | **Enide-win-x64.zip** → распаковать → `Enide.exe` |

            Уже стоит Enide 1.1+? Обновление придёт само при запуске.

            **macOS:** при первом запуске — Системные настройки → Конфиденциальность и безопасность → «Всё равно открыть» (или `xattr -cr /Applications/Enide.app`).
            **Windows:** если SmartScreen предупредит — «Подробнее» → «Выполнить в любом случае».

            Сборки без платной подписи Apple/Microsoft. Исходники и инструкции — в [README](https://github.com/${{ github.repository }}#readme).
